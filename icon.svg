<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="knight-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="gem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  
  <!-- Subtle chessboard grid lines in background -->
  <path d="M64 192h384M64 320h384M192 64v384M320 64v384" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Glowing Chess Knight piece -->
  <g filter="url(#glow)">
    <path d="M 176 384 L 336 384 C 336 370 330 350 310 340 C 330 310 326 270 320 236 C 304 220 286 216 276 218 C 280 196 266 170 240 156 C 220 146 198 148 184 156 C 180 142 168 136 156 140 C 146 144 142 156 144 172 C 128 186 122 208 126 230 C 130 250 148 262 164 266 C 160 280 158 300 162 322 C 166 346 172 366 176 384 Z" 
          fill="url(#knight-grad)" stroke="#94a3b8" stroke-width="6" stroke-linejoin="round"/>
    <!-- Knight Eye -->
    <circle cx="178" cy="192" r="8" fill="#0b0f17"/>
    <!-- Mane details -->
    <path d="M 230 178 Q 248 206 256 240 M 264 228 Q 284 256 288 288" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Brilliant Diamond Symbol on top right -->
  <g transform="translate(320, 110) scale(0.9)">
    <polygon points="40,0 75,25 60,65 20,65 5,25" fill="url(#gem-grad)" stroke="#ffffff" stroke-width="3"/>
    <polygon points="40,0 20,25 60,25" fill="#ffffff" fill-opacity="0.4"/>
    <polygon points="40,0 5,25 20,25" fill="#ffffff" fill-opacity="0.6"/>
    <polygon points="40,0 60,25 75,25" fill="#ffffff" fill-opacity="0.2"/>
    <polygon points="20,25 60,25 40,65" fill="#0891b2"/>
  </g>
</svg>
